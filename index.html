<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hi, I'm Alex</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --text: #e8ebf5;
      --muted: #9aa3c0;
      --accent: #6c8cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 0%, #1d2444 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid #2b3357;
      border-radius: 18px;
      padding: 36px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #a06cff);
      box-shadow: 0 8px 24px rgba(108, 140, 255, 0.4);
    }

    h1 { font-size: 24px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }

    .role {
      color: var(--muted);
      font-size: 14px;
      margin-top: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    p.bio {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.6;
      color: #c6cce4;
    }

    .links {
      margin-top: 24px;
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .links a {
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid #333c66;
      transition: background 0.15s, border-color 0.15s;
    }

    .links a:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">A</div>
    <h1>Hi, I'm <span>Alex</span></h1>
    <div class="role">Software Developer</div>
    <p class="bio">
      I build small, useful things for the web. I like clean code,
      good coffee, and long walks with no particular destination.
      Currently learning something new every week.
    </p>
    <div class="links">
      <a href="mailto:alex@example.com">Email</a>
      <a href="#">GitHub</a>
      <a href="#">LinkedIn</a>
    </div>
  </main>
</body>
</html>
