<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Melvin Ndege</title>
  <style>
    :root {
      --bg: #0f1220;
      --card: #1a1f35;
      --text: #e8ebf5;
      --muted: #9aa3c0;
      --accent: #6c8cff;
      --accent-2: #a06cff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 0%, #1d2444 0%, var(--bg) 60%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid #2b3357;
      border-radius: 20px;
      padding: 38px 32px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .avatar {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 24px rgba(108, 140, 255, 0.4);
    }

    h1 { font-size: 25px; letter-spacing: -0.02em; }
    h1 span {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .role {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p.bio {
      margin-top: 18px;
      font-size: 15px;
      line-height: 1.6;
      color: #c6cce4;
    }

    .links {
      margin-top: 26px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid #333c66;
      background: rgba(108, 140, 255, 0.06);
      transition: transform 0.15s, background 0.15s, border-color 0.15s,
        box-shadow 0.15s, color 0.15s;
    }

    .links a svg {
      width: 17px;
      height: 17px;
      flex: none;
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(108, 140, 255, 0.35);
    }

    .links a:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    @media (max-width: 360px) {
      .links { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" aria-hidden="true">MN</div>
    <h1>Hi, I'm <span>Melvin Ndege</span></h1>
    <div class="role">Software Developer</div>

      I build small, useful things for the web. I like clean code,
      good coffee, and long walks with no particular destination.
      Currently learning something new every week.

    </nav>
  </main>

</html>
